# ──────────────────────────────────────────────────────────────────────────
# pre-commit — local security barrier BEFORE every commit.
# Install:  uv tool install pre-commit  (or pipx install pre-commit)
#           pre-commit install
# Update versions:  pre-commit autoupdate
# ──────────────────────────────────────────────────────────────────────────
minimum_pre_commit_version: "3.5.0"
fail_fast: false

repos:
  # ── General hygiene + secret guardrails ──────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key          # blocks any committed private key
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: check-added-large-files     # avoids large binaries/dumps
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
        # tsconfig files are JSONC by TypeScript's own spec: comments are legal
        # there and this hook cannot parse them. Excluded by name rather than by
        # dropping the hook, so every other JSON file stays checked — the
        # provider descriptors above all.
        exclude: '(^|/)tsconfig(\..+)?\.json$'
      - id: check-toml
      - id: check-symlinks
      - id: forbid-submodules

  # ── Secret detection (full scan) ─────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: '(?x)^(\.secrets\.baseline$)'

  # ── Python lint + format (ruff) ──────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # ── Python security (bandit) ─────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "packages/python/pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: ^packages/python/src/
