version: 2
updates:
  - package-ecosystem: "npm"
    directories: ["/packages/node", "/examples/node"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "node"]
    commit-message:
      prefix: "deps"

  # Python SDK (uv)
  - package-ecosystem: "uv"
    directory: "/packages/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps"

  # GitHub Actions — keeps pins current (and proposes pinning by SHA).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
